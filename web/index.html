<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Snaplink</title>
<style>
  :root { --bg:#09090d; --card:#121219; --line:#23232e; --text:#ececf1; --muted:#8c8ca1; --accent:#7cf2c8; --accent2:#8b7cff; --err:#ff7a8a; }
  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; display:grid; place-items:center; background:radial-gradient(900px 500px at 20% -10%, rgba(139,124,255,.18), transparent 60%), radial-gradient(700px 400px at 100% 110%, rgba(124,242,200,.12), transparent 60%), var(--bg); color:var(--text); font:16px/1.5 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; padding:24px 16px; }
  main { width:100%; max-width:640px; }
  h1 { font-size:44px; letter-spacing:-.03em; margin:0 0 6px; }
  h1 span { background:linear-gradient(90deg, var(--accent), var(--accent2)); -webkit-background-clip:text; background-clip:text; color:transparent; }
  p.lead { color:var(--muted); margin:0 0 28px; }
  form { background:var(--card); border:1px solid var(--line); border-radius:18px; padding:20px; display:grid; gap:12px; box-shadow:0 30px 80px rgba(0,0,0,.45); }
  label { font-size:13px; color:var(--muted); }
  input { width:100%; background:#0c0c12; border:1px solid var(--line); color:var(--text); border-radius:12px; padding:13px 14px; font:inherit; outline:none; }
  input:focus { border-color:var(--accent2); }
  .row { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  button { cursor:pointer; border:0; border-radius:12px; padding:13px 18px; font:600 15px/1 inherit; color:#09090d; background:linear-gradient(90deg, var(--accent), var(--accent2)); }
  .result { margin-top:16px; background:var(--card); border:1px solid var(--line); border-radius:18px; padding:18px 20px; display:none; }
  .result.show { display:block; }
  .short { display:flex; gap:10px; align-items:center; justify-content:space-between; }
  .short a { color:var(--accent); font:600 20px/1.3 ui-monospace, SFMono-Regular, Menlo, monospace; text-decoration:none; word-break:break-all; }
  .ghost { background:transparent; color:var(--text); border:1px solid var(--line); padding:9px 12px; font-size:13px; }
  .meta { color:var(--muted); font-size:13px; margin-top:8px; word-break:break-all; }
  .meta b { color:var(--text); font-weight:600; }
  .error { color:var(--err); }
  footer { margin-top:22px; color:var(--muted); font-size:13px; display:flex; gap:16px; flex-wrap:wrap; }
  footer code { color:var(--text); }
  @media (max-width:520px) { .row { grid-template-columns:1fr; } h1 { font-size:36px; } }
</style>
</head>
<body>
<main>
  <h1><span>Snaplink</span></h1>
  <p class="lead">A fast URL shortener written in Go, backed by Redis.</p>
  <form id="f">
    <div><label for="url">Long URL</label><input id="url" type="url" required placeholder="https://example.com/a/very/long/link"></div>
    <div class="row">
      <div><label for="code">Custom code (optional)</label><input id="code" placeholder="my-launch" pattern="[A-Za-z0-9_-]{3,32}"></div>
      <div><label for="ttl">Expires after (optional)</label>
        <input id="ttl" list="ttls" placeholder="never"><datalist id="ttls"><option value="1 hour"><option value="1 day"><option value="7 days"><option value="30 days"></datalist></div>
    </div>
    <button type="submit">Shorten</button>
  </form>
  <section class="result" id="out" aria-live="polite"></section>
  <footer><span>API: <code>POST /api/links</code></span><span><code>GET /api/links/{code}</code></span><span><code>/metrics</code></span></footer>
</main>
<script>
const out = document.getElementById('out');
const ttlSeconds = v => ({ '1 hour': 3600, '1 day': 86400, '7 days': 604800, '30 days': 2592000 })[v.trim()] || 0;
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' })[c]);

async function refresh(code) {
  const res = await fetch('/api/links/' + encodeURIComponent(code));
  if (res.ok) render(await res.json());
}

function render(link) {
  const exp = link.expires_at ? new Date(link.expires_at).toLocaleString() : 'never';
  out.innerHTML = '<div class="short"><a href="' + esc(link.short_url) + '" target="_blank" rel="noopener">' + esc(link.short_url.replace(/^https?:\/\//, '')) + '</a>' +
    '<span><button class="ghost" id="copy" type="button">Copy</button> <button class="ghost" id="ref" type="button">Refresh</button></span></div>' +
    '<div class="meta">→ ' + esc(link.url) + '</div>' +
    '<div class="meta"><b>' + link.clicks + '</b> clicks · expires <b>' + esc(exp) + '</b></div>';
  out.classList.add('show');
  document.getElementById('copy').onclick = e => { navigator.clipboard.writeText(link.short_url); e.target.textContent = 'Copied'; };
  document.getElementById('ref').onclick = () => refresh(link.code);
}

document.getElementById('f').addEventListener('submit', async e => {
  e.preventDefault();
  const body = { url: document.getElementById('url').value };
  const code = document.getElementById('code').value.trim();
  const ttl = ttlSeconds(document.getElementById('ttl').value);
  if (code) body.custom_code = code;
  if (ttl) body.ttl_seconds = ttl;
  const res = await fetch('/api/links', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(body) });
  const data = await res.json();
  if (!res.ok) { out.innerHTML = '<span class="error">' + esc(data.error) + '</span>'; out.classList.add('show'); return; }
  render(data);
});
</script>
</body>
</html>
